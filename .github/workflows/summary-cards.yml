name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    name: generate-profile-cards
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Puppeteer
        run: npm install --no-package-lock

      - name: Scrape Codolio & Update DSA Stats Card
        env:
          CODOLIO_USERNAME: abhinavpuri
        run: node scripts/update-stats.mjs

      - name: Generate GitHub Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: output
          AUTO_PUSH: false
          UTC_OFFSET: 5.5
          ANIMATION: sequence
          DURATION: 4
          THEME: github_dark

      - name: Clean card title
        run: |
          python -c "
          import glob, re
          for fpath in glob.glob('profile-summary-card-output/**/*.svg', recursive=True):
              with open(fpath, 'r', encoding='utf-8') as f:
                  content = f.read()
              new_content = re.sub(r'abhinavgitin\s*\(.*?\)', 'abhinavgitin', content)
              new_content = re.sub(r'Commits\s*\(UTC\s*\+5\.[35]0?\)', 'Commits (UTC +5.30)', new_content)
              if new_content != content:
                  with open(fpath, 'w', encoding='utf-8') as f:
                      f.write(new_content)
          "

      - name: Push all cards to output branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: output
          commit_message: "chore: auto-update profile cards and DSA stats [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          create_branch: true
          push_options: '--force'
