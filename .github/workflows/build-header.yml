name: Build Typing Header

on:
  push:
    branches:
      - main
    paths:
      - 'assets/fonts/**'
      - 'assets/build_header.py'
      - '.github/workflows/build-header.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install Pillow

      - name: Generate SVG
        run: python assets/build_header.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/output/header.svg
          git commit -m "chore: auto-generate typing header svg" || exit 0
          git push